# Weekly updates, one PR per ecosystem and update type (patch / minor / major).
# Exact version pins are kept and bumped in place.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 5
    versioning-strategy: increase
    commit-message:
      prefix: chore
    groups:
      npm-patch:
        patterns: ["*"]
        update-types: ["patch"]
      npm-minor:
        patterns: ["*"]
        update-types: ["minor"]
      npm-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 5
    versioning-strategy: auto
    commit-message:
      prefix: chore
    groups:
      cargo-patch:
        patterns: ["*"]
        update-types: ["patch"]
      cargo-minor:
        patterns: ["*"]
        update-types: ["minor"]
      cargo-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 5
    commit-message:
      prefix: ci
    groups:
      actions-patch:
        patterns: ["*"]
        update-types: ["patch"]
      actions-minor:
        patterns: ["*"]
        update-types: ["minor"]
      actions-major:
        patterns: ["*"]
        update-types: ["major"]
