name: Security audit
on:
    push:
        branches:
            - main
        paths:
            - "**/Cargo.toml"
            - "**/pnpm-lock.yaml"
    pull_request:
        paths:
            - "**/Cargo.toml"
            - "**/pnpm-lock.yaml"
    schedule:
        - cron: "0 6 * * 1" # Weekly Monday 6am UTC

permissions:
    contents: read

jobs:
    cargo-audit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 2026-03-27
              with:
                toolchain: 1.98.0

            - name: Install cargo-audit
              uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
              with:
                tool: cargo-audit
            - name: generate Cargo.lock
              run: cargo generate-lockfile
            - name: Run cargo audit
              run: cargo audit --file Cargo.lock

    pnpm-audit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              with:
                run_install: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                node-version: '24.20.0'
            # --ignore-registry-errors: audit will fail only if the registry actually successfully responds with found vulnerabilities
            - run: pnpm audit --audit-level=high --ignore-registry-errors
