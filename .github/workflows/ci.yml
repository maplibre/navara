name: Tests

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 2026-03-27
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt, rust-src

      # Cache Rust build artifacts and dependencies
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "rust-deps"
          cache-on-failure: true
          # Cache cargo-make and wasm-pack binaries
          cache-all-crates: true

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: "pnpm"
          node-version: '24.20.0'

      - name: Install Tools (wasm-bindgen-cli, cargo-make)
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: wasm-bindgen-cli@0.2.126, cargo-make

      - name: Prepare
        run: cargo make prepare-ci

      - name: Run Build Example
        run: pnpm build:example

      - name: Run Build library
        run: pnpm build

      - name: Build IIFE
        run: pnpm build:iife

      - name: Build Integration Tests
        run: pnpm build:integration

      - name: Run Test
        run: cargo make test
        env:
          RUST_BACKTRACE: 1

      - name: Cargo format
        run: cargo make format-check

      - name: Lint
        run: cargo make lint-check

  rust-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 2026-03-27
        with:
          toolchain: 1.98.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "rust-docs"

      - run: cargo test --doc
      - run: cargo doc --all-features --release
