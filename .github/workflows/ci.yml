name: Tests

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 2026-03-27
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt, rust-src

      # Cache Rust build artifacts and dependencies
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "rust-deps"
          cache-on-failure: true
          # Cache cargo-make and wasm-pack binaries
          cache-all-crates: true

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: "pnpm"
          node-version: '24.22.1'

      - name: Install Tools (wasm-bindgen-cli, cargo-make)
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: wasm-bindgen-cli@0.2.126, cargo-make

      - name: Prepare
        run: cargo make prepare-ci

      - name: Run Build Example
        run: pnpm build:example

      - name: Run Build library
        run: pnpm build

      - name: Build IIFE
        run: pnpm build:iife

      - name: Build Integration Tests
        run: pnpm build:integration

      - name: Run Test
        run: cargo make test
        env:
          RUST_BACKTRACE: 1

      - name: Cargo format
        run: cargo make format-check

      - name: Lint
        run: cargo make lint-check

  rust-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 2026-03-27
        with:
          toolchain: 1.99.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "rust-docs"

      - run: cargo test --doc
      - run: cargo doc --all-features --release
