name: API docs

on:
  pull_request:
    paths:
      - docs/**
  push:
    branches:
      - main
    paths:
      - docs/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'

      - name: Install dependencies
        run: pnpm install --filter navara-developer-docs --frozen-lockfile

      # rehype-mermaid renders diagrams in headless Chromium via Playwright.
      - name: Install Playwright browser
        run: pnpm -C docs exec playwright install --with-deps --only-shell chromium

      - name: Build docs
        run: pnpm build:docs
