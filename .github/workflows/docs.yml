name: API docs

on:
  pull_request:
    paths:
      - docs/**
  push:
    branches:
      - main
    paths:
      - docs/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'

      - name: Install dependencies
        run: pnpm install --filter navara-developer-docs --frozen-lockfile

      # Checks only the showcase images the pull request adds or changes.
      - name: Check showcase images
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          pnpm -C docs showcases:check --base "origin/$BASE_REF"

      # rehype-mermaid renders diagrams in headless Chromium via Playwright.
      - name: Install Playwright browser
        run: pnpm -C docs exec playwright install --with-deps --only-shell chromium

      - name: Build docs
        run: pnpm build:docs
