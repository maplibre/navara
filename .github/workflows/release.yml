name: Release

# Publishes all @navaramap/* packages to npm via trusted publishing (OIDC),
# then creates the GitHub Release for the tag.
# Trigger: push a tag like `v0.1.0`. The tag is the single source of truth for
# the version; every package is stamped with it (lockstep versioning).
#
# Release steps:
#   1. cargo make changelog vX.Y.Z  — generates the CHANGELOG.md section from
#      conventional commits (git-cliff, see cliff.toml)
#   2. review/edit the section, commit it to main
#   3. push the vX.Y.Z tag — this workflow publishes to npm and then creates
#      a GitHub Release whose notes are the reviewed CHANGELOG.md section
#
# npm side setup (once per package, after its first publish):
#   npmjs.com -> package -> Settings -> Trusted Publisher
#   -> GitHub Actions: maplibre/navara, workflow file "release.yml",
#      environment "npm-publish"

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always
  # Keep in sync with the wasm-opt version used for local release builds.
  BINARYEN_VERSION: version_125
  # sha256 of binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz; update together
  # with BINARYEN_VERSION (the release publishes a .sha256 asset).
  BINARYEN_SHA256: 7c3bc16599c8274a04d34a504fe4be2047884f900e0e2da2f6fb9cd667183be4

permissions:
  contents: read

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    environment: npm-publish # gates publish on required reviewer approval
    permissions:
      contents: read
      id-token: write # for npm provenance and trusted publishing
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 2026-03-27
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown
          components: rust-src

      # No rust-cache here on purpose: release artifacts must come from a clean
      # build. Caches are writable by any workflow run on the default branch,
      # so restoring one here would let a poisoned cache end up in (and be
      # attested by) the published packages.

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: "pnpm"
          node-version: '24.20.0'
          registry-url: 'https://registry.npmjs.org'

      # Fail fast if the changelog section for this tag was never committed;
      # the github-release job below needs it for the release notes. Runs
      # after setup-node so the whole job uses the pinned Node version.
      - name: Verify changelog has an entry for this tag
        run: node scripts/extract-changelog.mjs "$GITHUB_REF_NAME" > /dev/null

      - name: Install Tools (wasm-bindgen-cli, cargo-make)
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: wasm-bindgen-cli@0.2.126, cargo-make

      # The bindgen tasks silently skip wasm-opt when it is missing, which is
      # fine for CI tests but not for release artifacts. Install binaryen and
      # fail fast if wasm-opt is unavailable.
      - name: Install binaryen (wasm-opt)
        run: |
          curl -fsSLo "$RUNNER_TEMP/binaryen.tar.gz" "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          echo "${BINARYEN_SHA256}  $RUNNER_TEMP/binaryen.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/binaryen.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Verify wasm-opt
        run: wasm-opt --version

      # Release WASM build (build-std + immediate-abort + wasm-opt -Oz),
      # then pnpm install with the generated wasm packages in the workspace. --frozen-lockfile
      - name: Build WASM (release)
        run: cargo make prepare-ci

      - name: Report WASM sizes
        run: cargo make size-report

      - name: Sync version from tag
        run: node scripts/set-version.mjs "$GITHUB_REF_NAME"

      - name: Build packages
        run: pnpm build

      - name: Publish to npm (trusted publishing)
        run: pnpm publish -r --provenance --access public --no-git-checks

  # Runs only after a successful npm publish. Kept as a separate job so that
  # `contents: write` never coexists with the OIDC publish permissions above.
  # The release notes are the human-reviewed CHANGELOG.md section — commit
  # messages are never interpolated into shell commands or regenerated here,
  # and the notes are passed to gh via a file, not inline.
  github-release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: publish
    # Skip on forks; keep in sync with the canonical repo slug — see the
    # trusted-publishing note at the top.
    if: github.repository == 'maplibre/navara'
    permissions:
      contents: write # create the GitHub Release for the pushed tag
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same pinned Node as the publish job, instead of whatever happens to
      # be preinstalled on the runner.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'

      - name: Extract release notes from CHANGELOG.md
        run: node scripts/extract-changelog.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
