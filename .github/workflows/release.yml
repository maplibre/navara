name: Release

# Publishes the @navaramap/* packages to npm via trusted publishing (OIDC).
# Two triggers share one build:
#   - manual run on main: a nightly of every package, web/experimental
#     included, versioned `X.Y.(Z+1)-nightly.N` (vX.Y.Z = latest release tag,
#     N = run number) under the `nightly` dist-tag. No changelog or GitHub
#     Release; the npm provenance records the commit. Skipped when main has
#     not moved since the last successful nightly.
#   - push of a tag like `v0.1.0`: the release. The tag is the single source
#     of truth for the version; every package is stamped with it (lockstep
#     versioning) and published under `latest`, web/experimental left out.
#     A GitHub Release follows.
#
# Release steps:
#   1. cargo make changelog vX.Y.Z  — generates the CHANGELOG.md section from
#      conventional commits (git-cliff, see cliff.toml)
#   2. review/edit the section, commit it to main
#   3. push the vX.Y.Z tag — this workflow publishes to npm and then creates
#      a GitHub Release whose notes are the reviewed CHANGELOG.md section
#
# npm side setup (once per package, after its first publish):
#   npmjs.com -> package -> Settings -> Trusted Publisher
#   -> GitHub Actions: maplibre/navara, workflow file "release.yml",
#      environment "npm-publish"
# GitHub side: "npm-publish" requires reviewer approval and accepts `v*` tags
# and main only. Releases and nightlies share it, so every publish is
# approved: a second, unreviewed trusted publisher would let any workflow
# change merged to main publish under `latest`, since npm cannot limit a
# trusted publisher to a dist-tag.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a running publish: one stopped midway leaves the packages at
  # mixed versions, and their exact `workspace:*` pins fail to install. A run
  # still waiting is replaced by a newer one.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Keep in sync with the wasm-opt version used for local release builds.
  BINARYEN_VERSION: version_125
  # sha256 of binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz; update together
  # with BINARYEN_VERSION (the release publishes a .sha256 asset).
  BINARYEN_SHA256: 7c3bc16599c8274a04d34a504fe4be2047884f900e0e2da2f6fb9cd667183be4

permissions:
  contents: read

jobs:
  # A release always publishes. A nightly publishes only when main has moved
  # since the last successful nightly; a run whose publish failed does not
  # count, so the next one retries the same commit.
  changes:
    name: Check for changes
    runs-on: ubuntu-latest
    # Skip on forks; keep in sync with the canonical repo slug — see the
    # trusted-publishing note at the top.
    if: github.repository == 'maplibre/navara'
    permissions:
      actions: read # list this workflow's previous runs
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only tag pushes trigger on push; a manual run on a tag is not a
          # release and is refused below.
          if [[ $GITHUB_EVENT_NAME == push ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ $GITHUB_REF != refs/heads/main ]]; then
            echo "Nightlies publish from main only, not $GITHUB_REF." >&2
            exit 1
          fi
          # Tag runs have the tag as their branch, so this sees nightlies only.
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""')
          if [[ $last == "$GITHUB_SHA" ]]; then
            echo "main is still at $GITHUB_SHA, published by the last nightly; skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: npm publish
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.publish == 'true'
    environment: npm-publish # gates publish on required reviewer approval
    permissions:
      contents: read
      id-token: write # for npm provenance and trusted publishing
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A nightly finds the latest release tag in the history.
          fetch-depth: ${{ github.ref_type == 'tag' && 1 || 0 }}

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 2026-03-27
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
          components: rust-src

      # No rust-cache here on purpose: release artifacts must come from a clean
      # build. Caches are writable by any workflow run on the default branch,
      # so restoring one here would let a poisoned cache end up in (and be
      # attested by) the published packages.

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: "pnpm"
          node-version: '24.22.1'
          registry-url: 'https://registry.npmjs.org'

      # Fail fast if the changelog section for this tag was never committed;
      # the github-release job below needs it for the release notes. Runs
      # after setup-node so the whole job uses the pinned Node version.
      - name: Verify changelog has an entry for this tag
        if: github.ref_type == 'tag'
        run: node scripts/extract-changelog.mjs "$GITHUB_REF_NAME" > /dev/null

      - name: Determine version
        run: |
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            version=$GITHUB_REF_NAME
          else
            latest=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude 'v*-*')
            # Checked before the arithmetic below, which would evaluate it.
            if [[ ! $latest =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Latest release tag $latest is not vX.Y.Z." >&2
              exit 1
            fi
            version=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))-nightly.$GITHUB_RUN_NUMBER
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install Tools (wasm-bindgen-cli, cargo-make)
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: wasm-bindgen-cli@0.2.126, cargo-make

      # The bindgen tasks silently skip wasm-opt when it is missing, which is
      # fine for CI tests but not for release artifacts. Install binaryen and
      # fail fast if wasm-opt is unavailable.
      - name: Install binaryen (wasm-opt)
        run: |
          curl -fsSLo "$RUNNER_TEMP/binaryen.tar.gz" "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          echo "${BINARYEN_SHA256}  $RUNNER_TEMP/binaryen.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/binaryen.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Verify wasm-opt
        run: wasm-opt --version

      # Release WASM build (build-std + immediate-abort + wasm-opt -Oz),
      # then pnpm install with the generated wasm packages in the workspace. --frozen-lockfile
      - name: Build WASM (release)
        run: cargo make prepare-ci

      - name: Report WASM sizes
        run: cargo make size-report

      - name: Sync version
        run: node scripts/set-version.mjs "$VERSION"

      - name: Build packages
        run: pnpm build

      # Packages under web/experimental ship in nightlies only, until they
      # move to web/.
      - name: Publish to npm (trusted publishing)
        run: |
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            pnpm publish -r --filter "!./web/experimental/**" --provenance --access public --no-git-checks
          else
            pnpm publish -r --tag nightly --provenance --access public --no-git-checks
          fi

  # Runs only after a successful npm publish of a release. Kept as a separate
  # job so that `contents: write` never coexists with the OIDC publish
  # permissions above. The release notes are the human-reviewed CHANGELOG.md
  # section — commit messages are never interpolated into shell commands or
  # regenerated here, and the notes are passed to gh via a file, not inline.
  github-release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref_type == 'tag'
    permissions:
      contents: write # create the GitHub Release for the pushed tag
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same pinned Node as the publish job, instead of whatever happens to
      # be preinstalled on the runner.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'

      - name: Extract release notes from CHANGELOG.md
        run: node scripts/extract-changelog.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
