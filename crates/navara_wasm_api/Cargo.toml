[package]
name = "navara_wasm_api"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
debug = ["navara_wasm_utils/console_error_panic_hook"]

[dependencies]
wasm-bindgen.workspace = true
serde.workspace = true
serde-wasm-bindgen.workspace = true
url.workspace = true
navara_core.workspace = true
# Path dep (not workspace-inherited) so default features can be disabled:
# the `bevy` default only adds an ECS derive this crate never uses, and it
# would pull bevy_ecs into the lightweight API module.
navara_geometry = { path = "../navara_geometry", default-features = false }
navara_math.workspace = true
navara_material.workspace = true
navara_feature_component.workspace = true
quantized-mesh.workspace = true
navara_wasm_types.workspace = true
navara_window.workspace = true
navara_camera.workspace = true
navara_wasm_utils.workspace = true

[package.metadata.wasm-pack.profile.profiling]
wasm-opt = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O4']
