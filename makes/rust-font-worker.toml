# ============================================================================
#                               BUILD TASKS
# ============================================================================
# Generate JS bindings for font worker WASM module
[tasks.bindgen-rust-font-worker]
script = ['''
#!/usr/bin/env bash

wasm-bindgen target/wasm32-unknown-unknown/release/navara_wasm_font_worker.wasm --out-dir web/wasm/navara_font_worker --target web
if command -v wasm-opt &> /dev/null; then
    wasm-opt -Oz --strip-debug --strip-producers web/wasm/navara_font_worker/navara_wasm_font_worker_bg.wasm -o web/wasm/navara_font_worker/navara_wasm_font_worker_bg.wasm
  else
    echo "wasm-opt not found, skipping optimization"
fi
''']

[tasks.bindgen-rust-font-worker.windows]
script = ['''
wasm-bindgen target/wasm32-unknown-unknown/release/navara_wasm_font_worker.wasm --out-dir web/wasm/navara_font_worker --target web
where wasm-opt >nul 2>&1 && wasm-opt -Oz --strip-debug --strip-producers web/wasm/navara_font_worker/navara_wasm_font_worker_bg.wasm -o web/wasm/navara_font_worker/navara_wasm_font_worker_bg.wasm || echo "wasm-opt not found, skipping optimization"
''']

[tasks.bindgen-dev-rust-font-worker]
script = ['''
#!/usr/bin/env bash

wasm-bindgen target/wasm32-unknown-unknown/debug/navara_wasm_font_worker.wasm --out-dir web/wasm/navara_font_worker --target web --keep-debug
''']

[tasks.bindgen-dev-rust-font-worker.windows]
script = ['''
wasm-bindgen target/wasm32-unknown-unknown/debug/navara_wasm_font_worker.wasm --out-dir web/wasm/navara_font_worker --target web --keep-debug
''']
