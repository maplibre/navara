# ============================================================================
#                               BUILD TASKS
# ============================================================================
# Build all WASM crates in a single cargo invocation to share compilation artifacts.
#
# Release binaries rebuild std via `-Z build-std` with `-Cpanic=immediate-abort`
# and `-Zlocation-detail=none`, dropping panic formatting and source-location
# strings (~6% smaller .wasm). The `-Z` flags are accepted on the pinned stable
# toolchain through RUSTC_BOOTSTRAP=1, so the shipped compiler stays a tested
# stable release. Requires the rust-src component
# (`rustup component add rust-src`). RUSTFLAGS overrides the target rustflags
# in .cargo/config.toml, so the getrandom cfg must be repeated here. SIMD is off;
# see guide/SIMD.md for the measurements behind that.
# Panics in these builds trap immediately without a message; use
# `cargo make build-debug` to diagnose panics with readable messages.
[tasks.build-rust-all-wasm]
env = { RUSTC_BOOTSTRAP = "1", RUSTFLAGS = '--cfg getrandom_backend="wasm_js" -Ctarget-feature=+simd128 -Zlocation-detail=none -Zunstable-options -Cpanic=immediate-abort' }
script = ['''
cargo build --release --target wasm32-unknown-unknown -Z build-std=std,panic_abort -p navara_wasm -p navara_wasm_worker -p navara_wasm_font_worker -p navara_wasm_api
''']

# Build the non-SIMD fallback of every module, dropped beside the primaries as
# `<crate>_bg.nosimd.wasm`. The web packages pick between them at runtime, so
# enabling `simd128` does not raise the browser floor. Roughly doubles WASM
# build time; `build-debug-all` and `build-dev-all` skip it.
[tasks.build-rust-wasm-fallback]
description = "Build the non-SIMD fallback .wasm for every module"
command = "node"
args = ["scripts/build-wasm-fallback.mjs"]

# Dev and debug builds regenerate the JS glue and the primary `.wasm` but do not
# rebuild the non-SIMD fallback (that would double an already slow watch loop).
# A stale fallback paired with fresh bindings is far worse than a missing one —
# it would load and then misbehave — so remove it. A non-SIMD runtime then fails
# with a clean 404 instead, which is the correct signal for a dev build.
[tasks.clean-wasm-fallback]
description = "Remove non-SIMD fallback artifacts (dev/debug builds ship SIMD only)"
script = ['''
#!/usr/bin/env bash
rm -f web/wasm/navara_engine/navara_wasm_bg.nosimd.wasm \
      web/wasm/navara_engine_worker/navara_wasm_worker_bg.nosimd.wasm \
      web/wasm/navara_font_worker/navara_wasm_font_worker_bg.nosimd.wasm \
      web/wasm/navara_engine_api/navara_wasm_api_bg.nosimd.wasm
''']

[tasks.clean-wasm-fallback.windows]
script = ['''
del /Q "web\wasm\navara_engine\navara_wasm_bg.nosimd.wasm" 2>nul
del /Q "web\wasm\navara_engine_worker\navara_wasm_worker_bg.nosimd.wasm" 2>nul
del /Q "web\wasm\navara_font_worker\navara_wasm_font_worker_bg.nosimd.wasm" 2>nul
del /Q "web\wasm\navara_engine_api\navara_wasm_api_bg.nosimd.wasm" 2>nul
''']

[tasks.build-debug-rust-all-wasm]
script = ['''
cargo build --release --features debug --target wasm32-unknown-unknown -p navara_wasm -p navara_wasm_worker -p navara_wasm_font_worker -p navara_wasm_api
''']

[tasks.build-dev-rust-all-wasm]
script = ['''
cargo build --features debug  --target wasm32-unknown-unknown -p navara_wasm -p navara_wasm_worker -p navara_wasm_font_worker -p navara_wasm_api
''']

# Generate JS bindings for each WASM module
# Note: wasm-bindgen-cli version must match the wasm-bindgen dependency version (0.2.126)
# Install with: cargo install wasm-bindgen-cli --version 0.2.126
# Optional: Install binaryen for wasm-opt optimization: https://github.com/WebAssembly/binaryen
[tasks.bindgen-rust]
script = ['''
#!/usr/bin/env bash

wasm-bindgen target/wasm32-unknown-unknown/release/navara_wasm.wasm --out-dir web/wasm/navara_engine --target web
if command -v wasm-opt &> /dev/null; then
    wasm-opt -Oz --strip-debug --strip-producers web/wasm/navara_engine/navara_wasm_bg.wasm -o web/wasm/navara_engine/navara_wasm_bg.wasm
  else 
    echo "wasm-opt not found, skipping optimization"
fi

# Generate package.json for pnpm workspace
cp crates/navara_wasm/_package.json web/wasm/navara_engine/package.json
''']

[tasks.bindgen-rust.windows]
script = ['''
wasm-bindgen target/wasm32-unknown-unknown/release/navara_wasm.wasm --out-dir web/wasm/navara_engine --target web
where wasm-opt >nul 2>&1 && wasm-opt -Oz --strip-debug --strip-producers web/wasm/navara_engine/navara_wasm_bg.wasm -o web/wasm/navara_engine/navara_wasm_bg.wasm || echo "wasm-opt not found, skipping optimization"

REM Generate package.json for pnpm workspace
copy /Y "crates\navara_wasm\_package.json" "web\wasm\navara_engine\package.json"
''']

[tasks.bindgen-dev-rust]
script = ['''
#!/usr/bin/env bash

wasm-bindgen target/wasm32-unknown-unknown/debug/navara_wasm.wasm --out-dir web/wasm/navara_engine --target web --keep-debug

# Generate package.json for pnpm workspace
cp crates/navara_wasm/_package.json web/wasm/navara_engine/package.json
''']

[tasks.bindgen-dev-rust.windows]
script = ['''
wasm-bindgen target/wasm32-unknown-unknown/debug/navara_wasm.wasm --out-dir web/wasm/navara_engine --target web --keep-debug

REM Generate package.json for pnpm workspace
copy /Y "crates\navara_wasm\_package.json" "web\wasm\navara_engine\package.json"
''']
# ============================================================================
#                               SIZE REPORT
# ============================================================================
[tasks.bench-terrain-simd]
description = "Compare terrain WASM with SIMD on/off and opt-level z/3 (Node/V8)"
command = "node"
args = ["scripts/bench-terrain-simd.mjs"]

# Print raw and compressed sizes of the built WASM modules in web/wasm/.
# Run after a release build (e.g. `cargo make build-all`) to track size changes.
[tasks.size-report]
script = ['''
#!/usr/bin/env bash

printf "%-55s %12s %12s %12s\n" "module" "raw" "gzip-9" "brotli-11"
for f in \
    web/wasm/navara_engine/navara_wasm_bg.wasm \
    web/wasm/navara_engine_worker/navara_wasm_worker_bg.wasm \
    web/wasm/navara_font_worker/navara_wasm_font_worker_bg.wasm \
    web/wasm/navara_engine_api/navara_wasm_api_bg.wasm; do
    if [ ! -f "$f" ]; then
        printf "%-55s %12s\n" "$f" "missing"
        continue
    fi
    raw=$(wc -c < "$f" | tr -d ' ')
    gz=$(gzip -9 -c "$f" | wc -c | tr -d ' ')
    if command -v brotli &> /dev/null; then
        br=$(brotli -q 11 -c "$f" | wc -c | tr -d ' ')
    else
        br="n/a"
    fi
    printf "%-55s %12s %12s %12s\n" "$f" "$raw" "$gz" "$br"
done
''']

# ============================================================================
#                               CODE QUALITY TASKS
# ============================================================================
[tasks.format-rust]
script = ['''
cargo fmt --all
''']

[tasks.format-check-rust]
script = ['''
cargo fmt --all --check
''']

[tasks.lint-rust]
script = ['''
cargo clippy --workspace --all-targets --all-features -- -D warnings
''']


[tasks.test-rust]
script = ['''
cargo test --workspace --all-targets --all-features
''']

[tasks.doc-rust]
script = ['''
cargo clean --doc
cargo doc --no-deps --all-features
''']
