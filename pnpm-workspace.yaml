packages:
  - web/**
  - debug_tile_server
  - docs
# navara_three <-> navara_three_react depend on each other via devDependencies.
ignoreWorkspaceCycles: true
allowBuilds:
  '@swc/core': false
  canvas: true
  esbuild: true
  msw: false
  sharp: true
  unrs-resolver: false
  workerd: true

# Overrides to patch transitive dependencies flagged by `pnpm audit`.
# Each entry targets a specific vulnerable range so non-vulnerable majors
# (e.g. minimatch@3, picomatch@4 ≥ 4.0.4) keep their original versions.
# Replacement versions are exact pins (same policy as Dependabot `versioning-strategy: increase`).
overrides:
  '@ungap/structured-clone@<1.3.1': 1.3.4
  brace-expansion@<1.1.20: 1.1.21
  brace-expansion@>=4.0.0 <5.0.11: 5.0.12
  defu@<6.1.5: 6.1.7
  devalue@>=5.1.0 <5.9.3: 5.9.4
  express-rate-limit@>=8.2.0 <8.2.2: 8.6.2
  fast-uri@<3.1.2: 4.1.5
  fast-uri@>=4.0.0 <4.1.4: 4.1.5
  flatted@<3.4.2: 3.4.4
  ip-address@<=10.3.0: 10.5.0
  js-yaml@>=4.0.0 <4.3.2: 4.3.2
  minimatch@>=9.0.0 <9.0.7: 10.2.6
  nanoid@<3.3.18: 3.3.18
  path-to-regexp@>=8.0.0 <8.4.0: 8.4.2
  picomatch@<2.3.2: 4.0.7
  picomatch@>=4.0.0 <4.0.4: 4.0.7
  sharp@<0.35.5: 0.35.5
  smol-toml@<1.7.1: 1.9.1
  undici@>=7.0.0 <7.30.1: 7.30.1
  uuid@<11.1.1: 14.0.2
